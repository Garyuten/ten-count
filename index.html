<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10秒ピッタリゲーム</title>
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ranking.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 class="game-title">10秒ピッタリゲーム</h1>
        <div class="timer-container">
            <div id="timer" class="timer" role="timer" aria-label="経過時間">
                <div>0</div>
                <div>0</div>
                <div class="dot">.</div>
                <div>0</div>
                <div>0</div>
            </div>
        </div>
        <div class="controls">
            <button
                id="actionBtn"
                class="button"
                data-action="start"
                data-label-start="スタート"
                data-label-stop="ココ！"
                data-label-retry="もう一度"
                aria-label="スタート"
            >スタート</button>
        </div>
        <div id="result" class="result"></div>

<section id="ranking-registration" class="hidden">
             <h2>ランキング登録</h2>
<div id="form-message" class="form-message hidden"></div>
             <form id="ranking-form">
                 <input type="text" id="ranking-name" name="name" placeholder="お名前を入れてください。">
                 <button type="submit" id="ranking-submit">送信</button>
             </form>
         </section>

        <section id="ranking-root">
            <h2>ランキング</h2>
            <div class="ranking-tabs">
                <button data-period="weekly">週別</button>
                <button data-period="daily">日別</button>
                <button data-period="you" class="current">あなた</button>
            </div>
            <div class="ranking-content">
                <div id="my-ranking" class="tab-content"></div>
                <div id="weekly-ranking" class="tab-content"></div>
                <div id="daily-ranking" class="tab-content"></div>
            </div>
        </section>
    </div>

</body>
</html>
