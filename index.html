<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10秒ピッタリゲーム</title>
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .timer {
            font-size: 4rem;
            margin: 2rem 0;
            font-weight: normal;
            color: #333;
            font-family: 'DS-Digital', monospace;
            margin-left: auto;
            margin-right: auto;
            display: grid;
            grid-template-columns: 2rem 2rem 1rem 2rem 2rem;
            gap: 0;
            width: fit-content;
        }
        .timer div {
            text-align: center;
        }
        .timer .dot {
            width: 1rem;
        }
        .timer-container {
            position: relative;
            height: 6rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button {
            font-size: 1.2rem;
            padding: 1rem 2rem;
            margin: 0.5rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #startBtn {
            background-color: #4CAF50;
            color: white;
        }
        #stopBtn {
            background-color: #f44336;
            color: white;
        }
        #retryBtn {
            background-color: #2196F3;
            color: white;
        }
        .button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .fade-out {
            animation: fadeOut 1s forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .result {
            text-align: center;
            margin: 1rem 0;
            color: #333;
            min-height: 5.5rem; /* より大きな高さを確保 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.2;
        }
        .score {
            font-size: 2.5rem;
            font-weight: bold;
            display: inline-block;
            margin: 0;
            line-height: 1;
        }
        .perfect {
            margin-top: 0.3rem;
            line-height: 1;
        }
        .unit {
            font-size: 0.5em;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>10秒ピッタリゲーム</h1>
        <div class="timer-container">
            <div id="timer" class="timer" role="timer" aria-label="経過時間">
                <div>0</div>
                <div>0</div>
                <div class="dot">.</div>
                <div>0</div>
                <div>0</div>
            </div>
        </div>
        <div class="controls">
            <button id="actionBtn" class="button">スタート</button>
        </div>
        <div id="result" class="result"></div>
    </div>
    <script>
        let startTime;
        let timerInterval;
        let fadeTimeout;
        let forceStopTimeout;
        let isRunning = false;

        const timerElement = document.getElementById('timer');
        const actionBtn = document.getElementById('actionBtn');
        const resultElement = document.getElementById('result');

        function resetTimers() {
            // すべてのタイマーをクリア
            clearInterval(timerInterval);
            clearTimeout(fadeTimeout);
            clearTimeout(forceStopTimeout);
            
            // 変数をリセット
            timerInterval = null;
            fadeTimeout = null;
            forceStopTimeout = null;
            isRunning = false;
            
            // 表示をリセット
            timerElement.innerHTML = `
                <div>0</div>
                <div>0</div>
                <div class="dot">.</div>
                <div>0</div>
                <div>0</div>
            `;
            timerElement.classList.remove('fade-out');
            actionBtn.textContent = 'スタート';
            resultElement.textContent = '';
        }

        function updateTimer() {
            const currentTime = (Date.now() - startTime) / 1000;
            const timeStr = currentTime.toFixed(2);
            const [whole, decimal] = timeStr.split('.');
            
            // 整数部と小数部を分けて表示
            timerElement.innerHTML = `
                <div>${whole.padStart(2, '0')[0]}</div>
                <div>${whole.padStart(2, '0')[1]}</div>
                <div class="dot">.</div>
                <div>${decimal[0]}</div>
                <div>${decimal[1]}</div>
            `;
        }

        function calculateScore(time) {
            const target = 10;
            const difference = Math.abs(time - target);
            // 差が小さいほど高得点（最大100点）
            const score = Math.max(0, Math.floor(100 - (difference * 20)));
            return score;
        }

        actionBtn.addEventListener('click', () => {
            if (actionBtn.textContent === 'スタート') {
                // 既存のタイマーをすべてクリア
                resetTimers();
                
                // ゲーム開始
                startTime = Date.now();
                isRunning = true;
                timerInterval = setInterval(updateTimer, 10);
                actionBtn.textContent = 'ココ！';
                resultElement.textContent = '';
                timerElement.classList.remove('fade-out');

                // 3秒後にカウントをフェードアウト
                fadeTimeout = setTimeout(() => {
                    timerElement.classList.add('fade-out');
                }, 3000);
    
                // 15秒経過で強制終了
                forceStopTimeout = setTimeout(() => {
                    if (isRunning) {
                        clearInterval(timerInterval);
                        clearTimeout(fadeTimeout);
                        isRunning = false;
                        
                        const finalTime = 15.0;
                        const score = 0; // 15秒以上は0点
                        
                        timerElement.classList.remove('fade-out');
                        actionBtn.textContent = 'もう一度';
                        
                        resultElement.innerHTML = `<div>スコア：<span class="score">${score}</span><span style="font-size: 1.5rem;">点</span></div>`;
                    }
                }, 15000);
    
                } else if (actionBtn.textContent === 'ココ！') {
                // 時間を止める
                if (!isRunning) return;
                
                clearInterval(timerInterval);
                clearTimeout(fadeTimeout);
                isRunning = false;
                
                const finalTime = (Date.now() - startTime) / 1000;
                const score = calculateScore(finalTime);
                
                timerElement.classList.remove('fade-out');
                actionBtn.textContent = 'もう一度';
                
                resultElement.innerHTML = `<div>スコア：<span class="score">${score}</span><span style="font-size: 1.5rem;">点</span></div>`;
                if (Math.abs(finalTime - 10) < 0.1) {
                    resultElement.innerHTML += '<div class="perfect">すごい！ピッタリ！</div>';
                }

            } else {
                // リトライ
                resetTimers();
            }
        });
    </script>
</body>
</html>
