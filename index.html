<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10秒ピッタリゲーム</title>
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>10秒ピッタリゲーム</h1>
        <div class="timer-container">
            <div id="timer" class="timer" role="timer" aria-label="経過時間">
                <div>0</div>
                <div>0</div>
                <div class="dot">.</div>
                <div>0</div>
                <div>0</div>
            </div>
        </div>
        <div class="controls">
            <button id="actionBtn" class="button">スタート</button>
        </div>
        <div id="result" class="result"></div>
    </div>
    <script src="js/script.js" defer></script>
</body>
</html>
