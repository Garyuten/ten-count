<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10秒ピッタリゲーム</title>
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ranking.css">
</head>
<body>
    <div class="container">
        <h1 class="game-title">10秒ピッタリゲーム</h1>
        <div class="timer-container">
            <div id="timer" class="timer" role="timer" aria-label="経過時間">
                <div>0</div>
                <div>0</div>
                <div class="dot">.</div>
                <div>0</div>
                <div>0</div>
            </div>
        </div>
        <div class="controls">
            <button
                id="actionBtn"
                class="button"
                data-action="start"
                data-label-start="スタート"
                data-label-stop="ココ！"
                data-label-retry="もう一度"
                aria-label="スタート"
            >スタート</button>
        </div>
        <div id="result" class="result"></div>
        <div id="ranking"></div>
    </div>
    <script src="js/script.js" type="module" defer></script>
</body>
</html>
